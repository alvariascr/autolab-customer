name: Customer CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'codex/**'
      - 'Emilio/**'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: autolab_customer

      - name: Checkout autolab_core
        uses: actions/checkout@v4
        with:
          repository: BlueZoneCP/autolab-core
          ref: codex/core-architecture-cleanup
          path: autolab_core
          token: ${{ secrets.AUTOLAB_CORE_READ_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: autolab_customer

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
        working-directory: autolab_customer

      - name: Analyze
        run: flutter analyze
        working-directory: autolab_customer

      - name: Test
        run: flutter test
        working-directory: autolab_customer
