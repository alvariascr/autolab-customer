name: autolab_customer
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flip_card: ^0.7.0
  font_awesome_flutter: ^10.7.0
  path: ^1.9.0
  crypto: ^3.0.3
  shared_preferences: ^2.2.3
  carousel_slider: ^5.1.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Functional / Either
  dartz: ^0.10.1

  # Supabase
  supabase_flutter: ^2.8.3

  # External links
  app_links: ^7.0.0
  url_launcher: ^6.3.0

  # Foundation package
  autolab_core:
    path: ../autolab_core

  # Navigation
  go_router: ^14.2.7

  # State management
  flutter_bloc: ^9.1.1

  # Dependency Injection
  get_it: ^9.2.1

  # Value equality (recomendado para estados/entidades)
  equatable: ^2.0.5

  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  latlong2: ^0.9.1

  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_secure_storage: ^9.2.2

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/virtual/
  fonts:
    - family: Waxcel
      fonts:
        - asset: assets/fonts/Waxcel.otf
