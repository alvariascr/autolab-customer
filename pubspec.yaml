name: autolab_customer
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # Foundation package
  autolab_core:
    path: ../autolab_core

  # Navigation
  go_router: ^14.2.7

  # State management
  flutter_bloc: ^9.1.1

  # Dependency Injection
  get_it: ^8.0.3

  # Value equality (recomendado para estados/entidades)
  equatable: ^2.0.5

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true