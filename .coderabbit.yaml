language: es

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true

  path_instructions:
    - path: "lib/**"
      instructions: |
        Proyecto Flutter/Dart.
        Priorizar hallazgos funcionales, errores async, manejo de estado, navegación,
        validaciones, localización, separación de capas y mantenibilidad.
        Evitar comentarios cosméticos o de estilo si no afectan funcionalidad,
        legibilidad o consistencia del proyecto.

    - path: "lib/features/**/presentation/**"
      instructions: |
        Revisar como capa de presentación.
        Los widgets no deben contener lógica de negocio compleja.
        Validar manejo correcto de estados loading, empty, error y success.
        Evitar textos visibles hardcodeados; usar localización cuando aplique.
        Revisar navegación, bloqueos de avance y mensajes de error al usuario.

    - path: "lib/features/**/application/**"
      instructions: |
        Revisar como capa de aplicación.
        Cubits deben coordinar estado y casos de uso, no acceder directamente
        a datasources ni a Supabase.
        Ruta esperada:
        Cubit -> UseCase -> Repository -> DataSource.
        Señalar si se inyecta un datasource directo en un Cubit.

    - path: "lib/features/**/domain/**"
      instructions: |
        Revisar como capa de dominio.
        Esta capa debe mantenerse libre de dependencias de Flutter, Supabase,
        widgets o detalles de infraestructura.
        Entidades, repositorios abstractos y casos de uso deben representar
        reglas o contratos del negocio.

    - path: "lib/features/**/data/**"
      instructions: |
        Revisar como capa de datos.
        Aquí sí pueden existir implementaciones contra Supabase, mappers,
        DTOs, datasources y repositorios concretos.
        Validar manejo de errores, parsing seguro, queries correctas y que
        no se expongan datos de otros usuarios.

    - path: "lib/features/workshops/**"
      instructions: |
        Esta área contiene talleres, servicios, productos y reserva de citas.
        Revisar especialmente:
        - Flujo de reserva completo.
        - Validación de vehículo, servicio, horario y método de pago.
        - Consistencia entre Cubit, State y UI.
        - Manejo de horarios ocupados.
        - Uso correcto de casos de uso y repositorios.
        - Evitar lógica de negocio dentro de widgets.
        - Evitar textos visibles hardcodeados.

    - path: "lib/features/**/data/datasources/**"
      instructions: |
        Revisar consultas a Supabase.
        Validar filtros por usuario, taller y relaciones necesarias.
        Señalar riesgos de seguridad, datos cruzados entre usuarios,
        parsing inseguro o manejo débil de errores.
        Para fechas, preferir parsing seguro y manejo de valores inesperados.

    - path: "lib/l10n/**"
      instructions: |
        Revisar consistencia de claves de localización.
        No sugerir cambios manuales innecesarios en archivos generados por gen-l10n.
        Validar que nuevos textos visibles tengan traducción.

    - path: "test/**"
      instructions: |
        Revisar que las pruebas cubran comportamiento relevante.
        Sugerir pruebas cuando haya riesgo funcional real:
        validaciones, errores, estados del Cubit, navegación crítica,
        llamadas a casos de uso o parsing de datos.

    - path: "linux/**"
      instructions: |
        Ignorar cambios generados de Flutter desktop salvo que el PR trate específicamente de desktop.

    - path: "macos/**"
      instructions: |
        Ignorar cambios generados de Flutter desktop salvo que el PR trate específicamente de desktop.

    - path: "windows/**"
      instructions: |
        Ignorar cambios generados de Flutter desktop salvo que el PR trate específicamente de desktop.